# Default run config. PRD §13.
# Every number here is a STARTING POINT to be tuned on the gold set (P8), then
# frozen per experiment. Do not treat as final.

profile: qwen3_8b_local

route:
  tau_fraction: 0.8      # tau = tau_fraction * effective_context (FR-2.3)
  token_margin: 0.10     # safety margin on the local tokenizer estimate

chunk:
  chunk_tokens: 3000
  overlap_tokens: 150
  fan_in_k: 4

decoding:
  temperature: 0.2
  top_p: 0.9
  seed: 1234

summary:
  compression_pct: 10
  think: false           # DECISION-37: Qwen3 thinking was ~90% of summary tokens
  max_words: null        # uploads cap it per job (JobOptions.max_summary_words)

keypoints:
  top_k: 8
  candidates_per_section: 5   # {n} in prompts/keypoints.v1.txt; PRD leaves it open
  theta_attr: 0.55
  dup_distance: 0.15
  lambda_graph: 0.5

verify:
  top_n_evidence: 5
  # theta_* are per verifier, FROZEN 2026-10-31 from AggreFact dev, 4349 stratified rows
  # (DECISION-28, results/tuning/aggrefact_dev.summary.json). Test split untouched.
  decomposer: ollama     # local by default; keeps API quota for generation
  # Checkpoints confirmed live 2026-10-29 (CLAUDE.md §8). revision = full commit sha.
  embedder:              # DECISION-14; bge-small-en-v1.5 is the alternative, compare on AggreFact dev
    checkpoint: sentence-transformers/all-MiniLM-L6-v2
    revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
  nli:
    checkpoint: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
    revision: "b3546ea6b0346eb6f8d5d68b13c7dc6d0376b3d7"
    batch_size: 32       # peak 947 MiB on the 4070
    theta_e: 0.10        # dev bal. acc. 0.675 (0.660 at 0.5)
    theta_c: 0.5         # not tunable from binary labels
  minicheck:             # DECISION-13: reimplemented Flan-T5-Large variant
    checkpoint: lytang/MiniCheck-Flan-T5-Large
    revision: "96eafd01cee2d16cf81aaa2fb226b14f422a37b3"
    batch_size: 16       # peak 2684 MiB at 500-word chunks
    chunk_words: 500     # upstream default for flan-t5-large
    theta_e: 0.5         # upstream default; dev curve flat 0.25-0.6 (bal. acc. 0.766)
    top_k_chunks: null   # every chunk (upstream, experiments); uploads use 5 (DECISION-39)

metrics:
  bertscore:             # bert-score's English default, pinned (PRD §12.5: comparability only)
    checkpoint: FacebookAI/roberta-large
    revision: "722cf37b1afa9454edce342e7895e588b6ff1d59"
    num_layers: 17
    baseline: roberta-large
    batch_size: 32

# fail = never silently mix models across one run (default for experiments)
# ollama = fall back to local (demo only)
fallback: fail

cache:
  enabled: true
  dir: .cache/llm
